[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hipaa-audit-suite"
version = "1.0.0"
description = "Defensive HIPAA Security Rule audit & configuration monitoring suite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["reportlab==4.2.0", "Flask==3.1.3"]

[project.optional-dependencies]
live = [
    "psycopg2-binary==2.9.9",
    "PyMySQL==1.1.1",
    "pymongo==4.7.2",
    "google-cloud-resource-manager==1.12.5",
    "google-cloud-storage==2.16.0",
    "google-auth==2.53.0",
    "cryptography>=43",
]
dev = ["pytest", "ruff", "bandit", "pip-audit"]

[project.scripts]
hipaa-audit = "audit_runner:main"

[tool.setuptools]
py-modules = ["audit_runner", "app", "hipaa_refs", "security", "outputs"]
packages = ["auditors", "config_checks", "log_monitors", "compliance_reports", "integrations"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/mock_*", "static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402"]
"audit_runner.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603", "B607", "B310", "B105", "B112"]
